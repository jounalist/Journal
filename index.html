async function make(close){
 const st=$('#st'),name=$('#dn').value.trim(),text=$('#tx').value.trim(),n=Math.min(100,Math.max(1,Math.round(+$('#nn').value||20))),due=$('#due').value,fo=$('#fo')?$('#fo').value:'';

 try{
  const sample=typeof claude!=='undefined'&&claude.use?await claude.use('sample'):null;if(!sample){st.textContent='KI ist hier nicht verfügbar – bitte die veröffentlichte Version in Claude öffnen und die KI-Freigabe erlauben.';$('#ok').disabled=false;return}
  const r=await sample.json(`Erstelle aus dem folgenden Material möglichst genau ${n} Lernkarteikarten auf Deutsch (höchstens ${n}). Antworte NUR mit JSON: {"cards":[{"q":"Frage","a":"Antwort"}]}.\n\nMaterial:\n`+text);
  if(!r||!r.cards||!r.cards.length)throw 0;
  const d={id:String(Date.now()),name,cards:r.cards.slice(0,n).map(c=>({q:c.q,a:c.a})),done:false,due};if(fo)d.folderId=fo;
  S.decks.unshift(d);close();render();
 }catch(e){st.textContent='Das hat leider nicht geklappt. Bitte versuche es erneut.';$('#ok').disabled=false}
}

const MODES={f:['Fokus',25],k:['Kurze Pause',5],l:['Lange Pause',15]};
let fm='f',left=25*60,end=null,tick=null;
function focus(){
 $('#ttl').textContent='Fokus';
 $('#app').innerHTML=`${ftLine()}<div class="tabs" style="margin-top:16px">${Object.entries(MODES).map(([k,[n,m]])=>`<button class="${k===fm?'on':''}" onclick="setM('${k}')">${n} ${m} min</button>`).join('')}</div>
 ${S.folders.length?`<select onchange="S.ffo=this.value;save()" style="margin-top:12px"><option value="">Fach für diese Runde …</option>${S.folders.map(f=>`<option value="${f.id}" ${f.id===S.ffo?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`:''}<div class="timer" id="tt"></div><div class="row" style="justify-content:center"><button class="solid" id="go" onclick="toggle()"></button><button onclick="setM(fm)">Zurücksetzen</button><button onclick="zen(1)">⛶ Ruhemodus</button></div><button id="zx" onclick="zen(0)" aria-label="Beenden">✕</button>
 `;paintT();
}
function pill(){let e=$('#fpill');if(!end||view==='focus'){e&&(e.style.display='none');return}if(!e){e=document.createElement('button');e.id='fpill';e.onclick=()=>go('focus');document.body.appendChild(e)}e.style.display='block';e.textContent=(fm==='f'?'⏱ ':'☕ ')+pad(Math.floor(left/60))+':'+pad(left%60)}
function fDone(){const f=fm==='f';sheet(`<h3 style="margin:0;font-weight:400">${f?'Fokuszeit vorbei 🎉':'Pause vorbei'}</h3><div class="muted">${f?'+1 Münze · Wie geht es weiter?':'Bereit für die nächste Runde?'}</div><div class="row" style="flex-direction:column"><button class="solid" id="fa">Weiterlernen</button>${f?'<button id="fb">Kurze Pause · 5 min</button><button id="fc">Lange Pause · 15 min</button>':''}</div>`,close=>{const run=k=>{close();setM(k);toggle()};$('#fa').onclick=()=>run('f');if(f){$('#fb').onclick=()=>run('k');$('#fc').onclick=()=>run('l')}})}
function paintT(){pill();const t=$('#tt');if(!t)return;t.textContent=pad(Math.floor(left/60))+':'+pad(left%60);$('#go').textContent=end?'Pause':'Start'}
window.setM=k=>{clearInterval(tick);end=null;fm=k;left=MODES[k][1]*60;if(view==='focus')focus()};
window.toggle=()=>{
 if(end){clearInterval(tick);left=Math.max(0,Math.round((end-Date.now())/1000));end=null;paintT();return}
 end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1000));
  if(left<=0){clearInterval(tick);end=null;if(fm==='f'){S.coins++;logF();save()}left=MODES[fm][1]*60;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}if(view==='focus'){paintT();toast(fm==='f'?'Fokus geschafft! +1 Münze':'Pause vorbei!')}else fDone();pill();return}
  paintT()},500);paintT();
};

const addDays=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return d};

const SYA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SYCH=150000,SYEN=new TextEncoder();
let syTimer=null,syBusy=false,syKeys={},syAsked=0,syState='';
const syCode=()=>LS.get('bjSy','');
const syNorm=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const syValid=t=>{let c=syNorm(t);if(c.length>12&&c.length<=24)c=c.slice(-12);return c.length===12&&[...c].every(ch=>SYA.includes(ch))?c:''};
const syFmt=c=>c.replace(/(.{4})(?=.)/g,'$1-');
const syNew=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>SYA[x&31]).join('');
const syTime=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const syOk=()=>!!(window.crypto&&crypto.subtle);
async function syDb(){if(bkDb)return bkDb;try{return typeof claude!=='undefined'&&claude.use?await claude.use('db'):null}catch(e){return null}}
async function syId(c){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',SYEN.encode('bj-id:'+c)));return [...h.slice(0,16)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function syKey(c){if(!syKeys[c]){const k=await crypto.subtle.importKey('raw',SYEN.encode(c),'PBKDF2',false,['deriveKey']);syKeys[c]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SYEN.encode('bullet-journal-sync-v1'),iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}return syKeys[c]}
async function syEnc(c,obj){let raw=SYEN.encode(JSON.stringify(obj)),fl=0;
 if(window.CompressionStream){const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));raw=new Uint8Array(await new Response(st).arrayBuffer());fl=1}
 const pl=new Uint8Array(raw.length+1);pl[0]=fl;pl.set(raw,1);
 const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await syKey(c),pl)),out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out)}
async function syDec(c,str){const u=unb64(str),pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},await syKey(c),u.slice(12)));let raw=pl.slice(1);
 if(pl[0]===1){const st=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));raw=new Uint8Array(await new Response(st).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(raw))}
const sySnap=()=>{if(!S.free)return S;const o=Object.assign({},S,{own:S.freeBak||{},coins:S.freeCoins||0});delete o.free;delete o.freeBak;delete o.freeCoins;return o};
let syAgain=false;
async function syPush(force){const c=syCode();if(!c||!syOk())return false;if(syBusy){syAgain=true;return false}const db=await syDb();if(!db){syState='nur in der veröffentlichten Version';return false}
 syBusy=true;try{const js=JSON.stringify(S);if(!force&&js===window.syLast)return true;
  const id=await syId(c),m=await db.doc('sync/'+id+'-m').get(),old=m.exists?m.data():null;
  if(!force&&old&&old.t>LS.get('bjSyT',0)){syState='In der Cloud liegt ein neuerer Stand. Lade ihn mit „Neuesten Stand abrufen“ oder sichere mit „Jetzt sichern“.';setTimeout(()=>syNewer(),0);return false}
  const t=Math.max(Date.now(),(old?old.t:0)+1),str=await syEnc(c,{v:2,t,s:sySnap()}),n=Math.ceil(str.length/SYCH)||1;
  for(let i=0;i<n;i++)await db.doc('sync/'+id+'-'+t+'-'+i).set({d:str.slice(i*SYCH,(i+1)*SYCH)});
  await db.doc('sync/'+id+'-m').set({t,n,v:2});
  if(old)for(let i=0;i<old.n;i++){try{await db.doc('sync/'+id+'-'+(old.v===2?old.t+'-':'')+i).delete()}catch(e){}}
  window.syLast=js;LS.set('bjSyT',t);syState='Zuletzt gesichert um '+new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});return true}
 catch(e){syState=e&&e.code==='invalid_argument'?'Keine Schreibrechte in dieser App – nur Laden möglich':'Sichern fehlgeschlagen';return false}
 finally{syBusy=false;syUi();if(syAgain){syAgain=false;syncSoon()}}}
async function syPull(c,retry){const db=await syDb();if(!db)throw new Error('nodb');const id=await syId(c),m=await db.doc('sync/'+id+'-m').get();if(!m.exists)return null;
 const {t,n,v}=m.data();let str='';
 try{for(let i=0;i<n;i++){const d=await db.doc('sync/'+id+'-'+(v===2?t+'-':'')+i).get();if(!d.exists)throw new Error('part');str+=d.data().d}}catch(e){if(!retry)return syPull(c,1);throw e}
 const p=await syDec(c,str);return {t,s:p.s}}
function syApply(c,r){S=r.s;normS();LS.set('bj',S);LS.set('bjSy',c);LS.set('bjSyT',r.t);window.syLast=JSON.stringify(S);syState='Zuletzt geladen: '+syTime(r.t);save();applyTheme();render();syUi()}
async function syLoad(c,close){const st=$('#ss');if(!syOk()){st.textContent='Dein Browser unterstützt den Sync-Code nicht.';return}

 try{r=await syPull(c)}catch(e){st.textContent=e&&e.message==='nodb'?'Der Sync-Code funktioniert nur in der veröffentlichten Version.':'Laden hat nicht geklappt. Bitte später noch einmal versuchen.';return}
 if(!r){st.textContent='Zu diesem Code gibt es noch keinen Stand. Bitte Code prüfen.';return}
 close();if(await ask('Stand vom '+syTime(r.t)+' laden? Die Daten auf diesem Gerät werden ersetzt. Dieses Gerät nutzt danach denselben Sync-Code.','Laden')){syApply(c,r);toast('✅ Stand geladen')}}
async function syNewer(manual){const c=syCode();if(!c||!syOk())return;try{const db=await syDb();if(!db){if(manual)toast('Nur in der veröffentlichten Version');return}const m=await db.doc('sync/'+(await syId(c))+'-m').get();if(!m.exists){if(manual)toast('Noch kein Stand in der Cloud');return}const t=m.data().t;
 if(t<=LS.get('bjSyT',0)){if(manual)toast('Du hast bereits den neuesten Stand');return}
 if(!manual&&syAsked===t)return;syAsked=t;
 if(!await ask('Auf deinem Sync-Code liegt ein neuerer Stand ('+syTime(t)+'). Jetzt laden? Die Daten auf diesem Gerät werden ersetzt.','Laden'))return;
 const r=await syPull(c);if(r){syApply(c,r);toast('✅ Neuer Stand geladen')}}catch(e){if(manual)toast('Abrufen hat nicht geklappt')}}
