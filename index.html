<nav id="nav"><button data-v="today" id="n-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Heute</button><button data-v="routines" id="n-routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4M8.5 12.5l2.5 2.5 4.5-5"/></svg>Routinen</button><button data-v="cal" class="mid" id="n-cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17.5h2"/></svg>Kalender</button><button data-v="cards" id="n-cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="12" rx="2"/><path d="M7 8V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>Karten</button><button data-v="shop" id="n-shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a3 3 0 0 1-5.3 1.9A3 3 0 0 1 12 14a3 3 0 0 1-2.7-1.1A3 3 0 0 1 4 11V9zM5 14v6h14v-6M10 20v-4h4v4"/></svg>Shop</button></nav>
<div id="toast"></div><div id="nh"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);const COIN='<span class="coin s"></span>';
let decEdit=false,dr=null,zl=null;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=LS.get('bj',{coins:0,events:[],decks:[],routines:[],pals:[]});
S.theme=S.theme||{mode:'light'};S.schemes=S.schemes||[];S.pantry=S.pantry||{};S.dishes=S.dishes||[];S.done=S.done||{};S.plates=S.plates||{};S.rest=S.rest||{t:[],b:[]};S.folders=S.folders||[];S.deco=S.deco||{};S.decoOff=S.decoOff||{};if(S.theme.mode==='custom')S.theme.mode='light';
const save=()=>{LS.set('bj',S);window.bkSoon&&bkSoon();const cn=$('#cn');if(+cn.textContent<S.coins){cn.classList.remove('bump');void cn.offsetWidth;cn.classList.add('bump')}cn.textContent=S.coins;try{$('#lv').textContent='Lv '+lvInfo().n}catch(e){}};
const PAL=[['Pastell',['#f6c9c9','#f8e0b0','#cfe5c4','#c5dcef','#dcd0ee']],['Erde',['#c9a27a','#a3b18a','#d9c5a0','#8c7b6b','#e2b9a0']],['Kräftig',['#e76f51','#f4a261','#2a9d8f','#457b9d','#9b5de5']],['Dezent',['#e8e2d6','#d8d3c4','#cbd5c0','#c3cfd9','#d9ccd6']]];
const TYPES=['Geburtstag','Hausaufgabe','Test','Privat'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const txtOn=h=>{const n=parseInt(h.slice(1),16);return ((n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11)>150?'#2b2824':'#fff'};
let view='day',cur=new Date();cur.setHours(0,0,0,0);
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let lastCal='day';function go(v){if(['day','week','month'].includes(v))lastCal=v;S.lv=v;S.lc=lastCal;if(v==='cards'){folderId=null;study=null;bzStop()}view=v;$('#drawer').classList.remove('open');$('#fab').style.display=['day','week','month','routines','cards'].includes(v)?'':'none';render()}
$('#coins').onclick=()=>go('shop');$('#sb').onclick=()=>go('search');$('#bb').onclick=()=>{const D=$('#drawer');D.querySelectorAll('a[data-v]').forEach(a=>{const on=a.dataset.v===view;a.classList.toggle('on',on);if(on&&a.classList.contains('sub'))a.parentElement.classList.add('open')});D.classList.add('open')};
$('#drawer').onclick=e=>{const a=e.target.closest('a');if(a&&a.dataset.t)$('#s-'+a.dataset.t).classList.toggle('open');else if(a&&a.dataset.act){$('#drawer').classList.remove('open');shareSheet()}else if(a)go(a.dataset.v);else if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};
$('#fab').onclick=()=>view==='routines'?routForm():view==='cards'?addChoice():evForm();

function updNav(){const c=['day','week','month'].includes(view)?'cal':view;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===c))}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v==='cal'?lastCal:b.dataset.v)};
function render(){save();updNav();pill();if(view!=='focus')document.documentElement.classList.remove('zen');if(view!=='today')decEdit=false;{const a=$('#app');a.classList.remove('fit');a.style.height='';document.documentElement.style.overflow='';document.documentElement.classList.remove('rf');if(view!=='shop')document.documentElement.classList.remove('navo');}({day:cal,week:cal,month:cal,today:homeV,cards,stats,focus,routines,shop,mode:modeV,tasks:tasksV,lists:listsV,review:reviewV,year:yearV,search:searchV})[view]()}
const shift=n=>{if(view==='month')cur.setMonth(cur.getMonth()+n);else cur.setDate(cur.getDate()+(view==='week'?7*n:n));render()};
window.shift=shift;window.today=()=>{cur=new Date();cur.setHours(0,0,0,0);render()};

const evsOn=k=>S.events.filter(e=>e.date===k||(e.rep&&e.date<k&&(!e.until||k<=e.until)&&(e.rep==='d'||(e.rep==='w'&&Math.round((new Date(k+'T12:00')-new Date(e.date+'T12:00'))/864e5)%7===0)||(e.rep==='m'&&e.date.slice(8)===k.slice(8)))));
const mDots=L=>L.length?'<div class="dts">'+L.slice(0,4).map(e=>`<i style="background:${e.color}"></i>`).join('')+(L.length>4?`<small>+${L.length-4}</small>`:'')+'</div>':'';
const fin=cl=>{const n=Math.max(0,...cl.map(y=>y.l))+1;cl.forEach(y=>y.n=n)};
const lay=L=>{const o=L.map(e=>({e,a:tm(e.start),b:Math.max(tm(e.end),tm(e.start)+30)})).sort((x,y)=>x.a-y.a||y.b-x.b);let cl=[],end=0;o.forEach(x=>{if(!cl.length||x.a>=end){fin(cl);cl=[];end=0}let l=0;while(cl.some(y=>y.l===l&&y.b>x.a))l++;x.l=l;cl.push(x);end=Math.max(end,x.b)});fin(cl);return o};
function cal(){
 $('#ttl').textContent={day:'Tag',week:'Woche',month:'Monat'}[view];
 let days=[],label;
 if(view==='day'){days=[new Date(cur)];label=cur.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
 else if(view==='week'){const m=new Date(cur);m.setDate(m.getDate()-((m.getDay()+6)%7));for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);days.push(d)}label='KW · '+days[0].toLocaleDateString('de-DE',{day:'numeric',month:'short'})+' – '+days[6].toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'})}
 else label=cur.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
 const bar=`<div class="bar" style="margin:0"><button onclick="shift(-1)">‹</button><span>${label}</span><span><button onclick="today()" style="padding:4px 10px;font-size:12px">Heute</button> <button onclick="shift(1)">›</button></span></div>`;let h='';
 if(view==='month'){h+=`<div class="stk">${bar}</div>`;
  const f=new Date(cur.getFullYear(),cur.getMonth(),1),off=(f.getDay()+6)%7,n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),t=ds(new Date());
  h+='<div class="month">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dh">${x}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="mc"></div>';
  for(let d=1;d<=n;d++){const k=ds(new Date(cur.getFullYear(),cur.getMonth(),d));
   h+=`<div class="mc ${k===t?'today':''}" onclick="pick('${k}')"><b>${d}</b>`+mDots(evsOn(k))+'</div>'}
  h+='</div>';
 }else{
  const c=days.length;
  h+=`<div class="stk">${bar}<div style="display:grid;grid-template-columns:34px repeat(${c},minmax(0,1fr))"><div></div>`+days.map(d=>`<div class="dh">${c===1?d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'}):WD[d.getDay()]+' '+d.getDate()}</div>`).join('')+'</div></div>';
  h+=`<div style="display:grid;grid-template-columns:34px repeat(${c},minmax(0,1fr))"><div>`+[...Array(24)].map((_,i)=>`<div class="hr" style="border:none">${pad(i)}</div>`).join('')+'</div>';
  days.forEach(d=>{const k=ds(d);
   h+=`<div class="col" onclick="pick('${k}',event)">`+[...Array(24)].map(()=>'<div class="hr"></div>').join('')+(k===ds(new Date())?`<div class="now" style="top:${nowPx()}px"></div>`:'');
   lay(evsOn(k)).forEach(({e,a,b,l,n})=>{
    h+=`<div class="ev" style="top:${a/60*44}px;height:${(b-a)/60*44-2}px;left:calc(${l}*100%/${n} + 2px);right:auto;width:calc(100%/${n} - 4px);background:${e.color};color:${txtOn(e.color)}" onclick="event.stopPropagation();evForm('${e.id}')"><b>${esc(e.title)}</b><span class="et">${e.start}–${e.end}</span></div>`});
   h+='</div>'});
  h+='</div>';
 }
 $('#app').innerHTML=h;
 if(view==='day'||view==='week'){const t=days.some(d=>ds(d)===ds(new Date()));window.scrollTo(0,t?Math.max(0,nowPx()-150):7*44)}
}
window.pick=(k,ev)=>{if(view==='month'){cur=new Date(k+'T00:00');view='day';render()}else{let h=9;if(ev&&ev.currentTarget){const r=ev.currentTarget.getBoundingClientRect();h=Math.max(0,Math.min(22,Math.floor((ev.clientY-r.top)/44)))}evForm(null,k,h)}};

function pals(){return [...PAL,...S.pals.map((p,i)=>['Eigene '+(i+1),p])]}
const QC=['#f6c9c9','#f8e0b0','#cfe5c4','#c5dcef','#dcd0ee','#e76f51','#2a9d8f','#457b9d'],TC={Geburtstag:'#f6c9c9',Hausaufgabe:'#f8e0b0',Test:'#e76f51',Privat:'#c5dcef'};
function evForm(id,date,h){
 const e=id?S.events.find(x=>x.id===id):{type:'Privat',title:'',date:date||ds(cur),start:pad(h??9)+':00',end:pad((h??9)+1)+':00',color:'#c5dcef'};
 let color=e.color,type=e.type,tch=!!id;
 const m=$('#modal'),sh=$('#sheet');m.classList.add('open');
 const draw=()=>{sh.innerHTML=`<h3 style="margin:0;font-weight:400">${id?'Termin bearbeiten':'Neuer Termin'}</h3>
 <div class="row types">${TYPES.map(t=>`<button data-t="${t}" class="${t===type?'on':''}" style="padding:6px 2px;font-size:12px">${t}</button>`).join('')}</div>
 <input id="f-t" placeholder="Titel" value="${esc(e.title)}">
 ${S.folders.length?`<label class="muted">Fach (optional)<select id="f-fo"><option value="">Kein Fach</option>${S.folders.map(f=>`<option value="${f.id}" ${f.id===e.fo?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>`:''}
 <input id="f-d" type="date" value="${e.date}">
 <div class="row"><label class="muted">Von<input id="f-s" type="time" value="${e.start}"></label><label class="muted">Bis<input id="f-e" type="time" value="${e.end}"></label></div>
 <div class="row"><label class="muted">Wiederholen<select id="f-r">${[['','Nie'],['d','Täglich'],['w','Wöchentlich'],['m','Monatlich']].map(([v,n])=>`<option value="${v}" ${v===(e.rep||'')?'selected':''}>${n}</option>`).join('')}</select></label><label class="muted">bis<input id="f-u" type="date" value="${e.until||''}"></label></div>
 <div class="muted">Farbe</div><div class="pal">${QC.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="f-c" value="${color}" style="width:34px;height:34px;padding:2px"></div>
 <div class="row"><button id="cx">Abbrechen</button>${id?'<button id="del">Löschen</button>':''}<button class="solid" id="ok">Speichern</button></div>`;
 sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{keep();type=b.dataset.t;if(!id&&!tch)color=TC[type]||color;draw()});
 sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{keep();color=b.dataset.c;tch=1;draw()});
 $('#f-c').oninput=ev=>{color=ev.target.value;tch=1};
 $('#cx').onclick=close;
 if(id)$('#del').onclick=()=>{S.events=S.events.filter(x=>x.id!==id);close();render()};
 $('#ok').onclick=()=>{keep();if(tm(e.end)<=tm(e.start)){toast('Das Ende muss nach dem Start liegen.');return}
  const o={id:id||String(Date.now()),type,title:e.title||type,date:e.date,start:e.start,end:e.end,color,rep:e.rep||'',until:e.until||'',fo:e.fo||''};
  if(id)S.events=S.events.map(x=>x.id===id?o:x);else S.events.push(o);close();render()};
 };
 const keep=()=>{e.fo=$('#f-fo')?$('#f-fo').value:e.fo;e.title=$('#f-t').value;e.date=$('#f-d').value||e.date;e.start=$('#f-s').value||e.start;e.end=$('#f-e').value||e.end;e.rep=$('#f-r')?$('#f-r').value:e.rep;e.until=$('#f-u')?$('#f-u').value:e.until};
 const close=()=>m.classList.remove('open');
 m.onclick=ev=>{if(ev.target===m)close()};
 draw();
}

/* ---------- Karten ---------- */
let study=null,folderId=null,sel=new Set();
function sheet(html,setup){const m=$('#modal'),sh=$('#sheet');sh.innerHTML=html;m.classList.add('open');const close=()=>m.classList.remove('open');m.onclick=e=>{if(e.target===m)close()};setup(close)}
const COLS=['#c9a27a','#a3b18a','#e76f51','#457b9d','#9b5de5','#f4a261','#2a9d8f','#e5989b'];
const ICONS=['📁','📚','🧠','🎓','🔬','🌍','🎨','🧮'];
const SV=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const FL=(a,b,c)=>`<rect x="3" y="5" width="6" height="14" fill="${a}" stroke="none"/><rect x="9" y="5" width="6" height="14" fill="${b}" stroke="none"/><rect x="15" y="5" width="6" height="14" fill="${c}" stroke="none"/><rect x="3" y="5" width="18" height="14" rx="1" opacity=".5"/>`;
const SUBJ={
'Deutsch':[`<rect x="3" y="5" width="18" height="4.7" fill="#222" stroke="none"/><rect x="3" y="9.7" width="18" height="4.7" fill="#d62828" stroke="none"/><rect x="3" y="14.4" width="18" height="4.7" fill="#fcbf49" stroke="none"/><rect x="3" y="5" width="18" height="14" rx="1" opacity=".5"/>`,'Deutsch',/deutsch/i],
'Geschichte':[`<path d="M6 3h12M6 21h12M7 3c0 5 4 6 5 9-1 3-5 4-5 9M17 3c0 5-4 6-5 9 1 3 5 4 5 9"/>`,'Geschichte',/geschichte/i],
'Italienisch':[FL('#2a9d3f','#fff','#d62828'),'Italienisch',/ital/i],
'Französisch':[FL('#2b4fa3','#fff','#d62828'),'Französisch',/franz/i],
'Englisch':[`<rect x="3" y="5" width="18" height="14" fill="#2b4fa3" stroke="none"/><path d="M3 5l18 14M21 5L3 19" stroke="#fff" stroke-width="2.4"/><path d="M12 5v14M3 12h18" stroke="#fff" stroke-width="4.5"/><path d="M12 5v14M3 12h18" stroke="#d62828" stroke-width="2.2"/><rect x="3" y="5" width="18" height="14" rx="1" opacity=".5"/>`,'Englisch',/engl/i],
'Weinkunde':[`<path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3zM12 12.5V20M8 21h8M8.4 7h7.2"/>`,'Weinkunde',/wein/i],
'Kochen':[`<path d="M7 14a4 4 0 0 1-1-7.8A4.5 4.5 0 0 1 12 4a4.5 4.5 0 0 1 6 2.2A4 4 0 0 1 17 14v6H7v-6zM7 17h10"/>`,'Kochen',/koch/i],
'Mathe':[`<path d="M5 8h6M8 5v6M14 8h6M5 17h6M14 14.5l6 6M20 14.5l-6 6"/><circle cx="8" cy="14.2" r=".7"/><circle cx="8" cy="19.8" r=".7"/>`,'Mathe',/mathe/i],
'Ernährung':[`<path d="M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1.5-.6 2-.6s1 .6 2 .6c2 0 5-4 5-8 0-6-5-7-7-5zM12 7c0-2 1-3.5 3-4"/>`,'Ernährung',/ern[aä]hr/i],
'Rechts- und Wirtschaftskunde':[`<path d="M12 4v16M8 20h8M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/>`,'RWK',/rechts|rwk|wirtschaftskunde/i],
'Betriebswirtschaftslehre':[`<path d="M4 20h16M6 20v-5M11 20v-8M16 20v-11M4 10l5-4 4 3 6-5M15 4h4v4"/>`,'BWL',/betrieb|bwl/i],
'Empfang':[`<path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 10V7M10 7h4M9 20h6"/>`,'Empfang',/empfang/i]};
const ic=i=>SUBJ[i]?SV(SUBJ[i][0]):i;
const DES=[['grad','Verlauf'],['flat','Einfarbig'],['dots','Gepunktet'],['stripes','Gestreift']];
function fStyle(f){const c=f.color,d=f.design||'grad',bg=d==='grad'?`linear-gradient(135deg,${c},color-mix(in srgb,${c} 50%,#fff))`:d==='dots'?`radial-gradient(#ffffff66 2px,transparent 2.5px) 0 0/14px 14px,${c}`:d==='stripes'?`repeating-linear-gradient(45deg,#ffffff33 0 8px,transparent 8px 16px),${c}`:c;return `background:${bg};color:${txtOn(c)}`}
const fdecks=id=>S.decks.filter(d=>d.folderId===id);
const gOk=c=>c.s==='g'&&!!c.due&&c.due>ds(new Date());
const gp=L=>{const a=L.flatMap(d=>d.cards);return a.length?Math.round(a.filter(gOk).length/a.length*100):0};
const prog=d=>gp([d]);
const reward=d=>Math.max(2,Math.round(d.cards.length*0.6));
const daysLeft=d=>{const n=Math.round((new Date(d.due+'T00:00')-new Date(ds(new Date())+'T00:00'))/864e5);return n<0?'Frist abgelaufen':n===0?'heute fällig':`noch ${n} Tag${n>1?'e':''}`};
const fSel=v=>`<label class="muted">Ordner<select id="fo"><option value="">Kein Ordner</option>${S.folders.map(f=>`<option value="${f.id}" ${f.id===v?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>`;
const pool=ids=>ids.flatMap(id=>{const d=S.decks.find(x=>x.id===id);return d?d.cards.map((c,i)=>({d,i,c})):[]});
const wt=c=>c.s==='s'?5:c.s==='m'?2:3;
function nextCard(ids,last,hard){
 let p=hard?pool(ids).filter(x=>(x.c.b||0)>=2):pool(ids).filter(x=>!gOk(x.c)&&(!x.c.due||x.c.due<=dOff(0)));
 if(p.length>1&&last)p=p.filter(x=>!(x.d===last.d&&x.i===last.i));
 if(!p.length)return null;
 let r=Math.random()*p.reduce((a,x)=>a+wt(x.c),0);
 for(const x of p){r-=wt(x.c);if(r<=0)return x}return p[0];
}
window.startStudy=ids=>{ids=ids.filter(id=>S.decks.some(d=>d.id===id));if(!ids.length)return;
 study={ids,cur:nextCard(ids,null),f:false,quiz:!!S.qz};cards()};
window.studyFolder=id=>startStudy(fdecks(id).map(d=>d.id));
window.startSel=()=>startStudy([...sel]);
window.togSel=id=>{sel.has(id)?sel.delete(id):sel.add(id);cards()};
window.openFolder=id=>{folderId=id;sel.clear();cards()};
function award(){let g=0;study.ids.forEach(id=>{const k=S.decks.find(x=>x.id===id);if(k&&!k.done&&k.cards.length&&k.cards.every(c=>c.s==='g')){k.done=true;g+=reward(k)}});S.coins+=g;return g}
window.editCard=()=>{const c=study.cur;sheet(`<h3 style="margin:0;font-weight:400">Karte bearbeiten</h3><textarea id="eq" rows="3">${esc(c.c.q)}</textarea><textarea id="ea" rows="4">${esc(c.c.a)}</textarea><div class="row"><button id="cx">Abbrechen</button><button id="del">Löschen</button><button class="solid" id="ok">Speichern</button></div>`,close=>{

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
 if(window.CompressionStream){const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return 'z'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
 return 'r'+b64(raw)}
async function unpack(s){const u=unb64(s.slice(1));let raw=u;
 if(s[0]==='z'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));raw=new Uint8Array(await new Response(st).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(raw))}
